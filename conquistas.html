<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conquistas</title>
    <style>

        * {
            margin: 0;
            box-sizing: border-box;
            
        }
        body {
            min-height: 100vh;
            border: 25px solid black;
            font-family: "Comic Sans MS", cursive;

            display: grid;
            grid-template-rows: auto 1fr;
        }
        header {
            border: 3px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1000px;
        }
        a {
            border: 2px solid black;
            font-size: 20px;
            padding: 8px;
        }
        hr {
            border: 1px solid black;
            margin: 0 50px;
        }
        .conquistas {
            padding: 30px;
        }

    </style>

</head>
<body>
    <header>
        <h1>Emoji Clicker</h1><sup><a href="index.html">Principal</a>
        <a href="conquistas.html">Conquistas</a></sup></h1>
    </header>
    <main>
        <div class="bloqueada">
            <div id="listaBloqueadas"></div>
        </div>

        <hr>

        <div class="desbloqueada">
            <div id="listaDesbloqueadas"></div>
        </div>
    </main>
    <footer>

    </footer>
    
    <script>

        const conquistas = [
            {
                id: "primeiroClick",
                nome: "Primeiro Click"
            },
            {
                id: "cemPontos",
                nome: "100 pontos"
            }
        ];

        const desbloqueadas = JSON.parse(localStorage.getItem("conquistas")) || [];

        const listaBloqueadas = document.getElementById("listaBloqueadas");
        const listaDesbloqueadas = document.getElementById("listaDesbloqueadas");

        conquistas.forEach(conquista => {

            const div = document.createElement("div");

            div.textContent = conquista.nome;

            if (desbloqueadas.includes(conquista.id)) {
                listaDesbloqueadas.appendChild(div);
            } else {
                listaBloqueadas.appendChild(div);
            }

        })

        
    </script>
</body>
</html>
