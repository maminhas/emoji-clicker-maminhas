<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emoji clicker</title>
    <style>

        * {
            margin: 0;
            box-sizing: border-box;
            
        }
        body {
            min-height: 100vh;
            border: 8px solid black;
            font-family: "Comic Sans MS", sans-serif;
            display: grid;
            grid-template-rows: auto 1fr;
        }
        header {
            border: 3px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            min-width: 0;
        }
        header h1 {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            text-align: center;
        }
        a {
            border: 2px solid black;
            font-size: 20px;
            padding: 8px;
        }
        main {
            display: grid;
            place-items: center;
            border: 3px solid black;
            user-select: none;
            min-width: 0;
            padding: 12px;
        }
        .mainb {
            font-size: clamp(100px, 28vw, 300px);
            line-height: 1.1;
            max-width: 100%;
            border: 0;
            background: white;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transform: scale(1);
            transition: transform 60ms ease-out;
        }

        .mainb:active {
            transform: scale(0.88);
            transition: transform 30ms ease-in;
        }
        p {
            font-size: clamp(1.2rem, 6vw, 5rem);
            overflow-wrap: anywhere;
        }
        .numero-flutuante {
            position: fixed;
            z-index: 9999;
            font-size: 30px;
            font-weight: bold;
            color: goldenrod;
            pointer-events: none;
            white-space: nowrap;

            animation: subir 700ms ease-out forwards;
        }

        @keyframes subir {
            0% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -100px) scale(1.2);
            }
        }
        
        footer {

        }
        section {
            display: grid;
            grid-template-columns: minmax(120px, 180px) minmax(0, 1fr);
            min-height: calc(100vh - 100px);
            min-width: 0;
        }
        .upgrade h3 {
            font-size: 25px;
        }
        
        .upgrades {
            border: 3px solid black;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 0;
            padding: 8px;
        }
        .upgrade {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 100%;
        }
        .upgrade button {
            max-width: 100%;
            overflow-wrap: anywhere;
        }
        .farm {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;

        }
        .farm-area {
            border: 3px solid black;
            padding: 10px;
            min-width: 0;
        }
        .farm-area h3 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }
        .farm button {
            font-family: inherit;
            font-size: 18px;
            padding: 8px;
            min-width: 0;
            flex: 1 1 110px;
        }
        .game {
            display: grid;
            grid-template-rows: minmax(300px, 1fr) auto;
            min-width: 0;
        }
        .pipa, .presente, .coração, .áries {
            font-size: 100px;
        }
        .comprado {
            font-size: 20px !important;
        }
        .pontuação {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            min-width: 0;
            gap: clamp(12px, 4vw, 100px);
            background: #ddd;
            border: 3px solid #aaa;
            padding: clamp(10px, 3vw, 25px);
            border-radius: 30px;
            max-width: 100%;
        }

        @media (max-width: 650px) {
            body {
                border-width: 4px;
            }
            section {
                grid-template-columns: minmax(0, 1fr);
                min-height: auto;
            }
            .upgrades {
                order: 2;
                padding: 12px;
            }
            .upgrade {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .upgrade button {
                font-size: clamp(30px, 10vw, 54px);
            }
            .game {
                order: 1;
                grid-template-rows: auto auto;
            }
            main {
                min-height: 55vh;
            }
            .mainb {
                font-size: clamp(110px, 38vw, 220px);
            }
            .pontuação {
                width: 100%;
                gap: 12px;
                border-radius: 16px;
            }
            .pontuação p {
                font-size: clamp(1.2rem, 7vw, 2.5rem);
            }
            .farm-area h3 {
                font-size: 24px;
            }
            .farm button {
                flex-basis: 105px;
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {
            body {
                border-width: 2px;
            }
            .farm-area {
                padding: 6px;
            }
            .farm {
                gap: 6px;
            }
            .farm button {
                flex-basis: 90px;
                padding: 6px 4px;
                font-size: 14px;
            }
        }

    </style>
</head>
<body>
    <header>

        <h1>Emoji Clicker </h1>
        
    </header>
    <section> 
         <div class="upgrades">
        <h3>upgrades</h3>
            <div class="upgrade">
            </div>
        </div>   

    <div class="game">
    <main>
        <div class="pontuação">
            <p class="main">0</p>
            <p id="goldPerSec"> 0g/s</p>
        </div>
        
        <button class="mainb" onclick="joia(event)">💰️</button>
    </main>
    
        <div class="farm-area">
        <h3>fazenda</h3>
            <div class="farm">
                <button onclick="felizComprado()">🙂 <br>
                custa 100 <br>
                1g/s
                </button>

                <button onclick="sorrisoComprado()">😁 <br>
                custa 500 <br>
                15g/s
                </button>

                <button onclick="rindoComprado()">😂 <br>
                custa 1500 <br>
                100g/s
                </button>

                <button onclick="derretidoComprado()">🥴 <br>
                custa 4000 <br>
                380g/s
                </button>

                <button onclick="doidoComprado()">🤪 <br>
                custa 15000 <br>
                1300g/s
                </button>

                <button onclick="iradoComprado()">😎 <br>
                custa 40000 <br>
                10500g/s
                </button>

            </div>
        </div>
    </div>  
    </section>
    <footer>
    </footer>
    <script>

        let numero = 0;
        let pontosPorSegundo = 0;
        let pontosPorClick = 1;
        let multiPontos = 1;
        let upg1liberado = false;
        let upg1comprado = false;
        let upg2liberado = false;
        let upg2comprado = false;
        let upg3liberado = false;
        let upg3comprado = false;
        let upg4liberado = false;
        let upg4comprado = false;

        function mostrarNumero(valor, x, y) {
            const numeroFlutuante = document.createElement("span");

            numeroFlutuante.classList.add("numero-flutuante");
            numeroFlutuante.innerText = "+" + valor.toFixed(1);

            numeroFlutuante.style.left = x + "px";
            numeroFlutuante.style.top = y + "px";

            document.body.appendChild(numeroFlutuante);

            setTimeout(() => {
                numeroFlutuante.remove();
            }, 700);
        }

    setTimeout(() => {
        numeroFlutuante.remove();
    }, 800);

        //PONTOS POR SEGUNDO
        setInterval(() => {
            numero += (pontosPorSegundo * multiPontos);
            renderJoia();
            goldPorSeg();
        }, 1000)

        function felizComprado() {
            if (numero >= 100) {
                pontosPorSegundo += 1;
                numero -=100;

                renderJoia();
                goldPorSeg();
            }
            
        }
        function sorrisoComprado() {
            if (numero >= 500) {
                pontosPorSegundo += 15;
                numero -=500;renderJoia();

                renderJoia();
                goldPorSeg();
            }
            
        }
        function rindoComprado() {
            if (numero >= 1500) {
                pontosPorSegundo += 100;
                numero -=1500;

                renderJoia();
                goldPorSeg();
            }
            
        }
        function derretidoComprado() {
            if (numero >= 4000) {
                pontosPorSegundo += 380;
                numero -=4000;

                renderJoia();
                goldPorSeg();
            }
            
        }
        function doidoComprado() {
            if (numero >= 15000) {
                pontosPorSegundo += 1300;
                numero -=15000;

                renderJoia();
                goldPorSeg();
            }
            
        }
        function iradoComprado() {
            if (numero >= 40000) {
                pontosPorSegundo += 10500;
                numero -=40000;

                renderJoia();
                goldPorSeg();
            }
            renderJoia();
        }

        //CLICK
        function pontos(event) {
            numero += pontosPorClick;

            mostrarNumero(pontosPorClick, event.clientX, event.clientY);

            renderJoia();
        }

        function joia(event) {
            pontos(event);
            
            if (numero >= 100 && !upg1liberado) {
                upgrade1();
                upg1liberado = true;
            }
            if (numero >= 600 && !upg2liberado) {
                upgrade2();
                upg2liberado = true;
            }
            if (numero >= 1400 && !upg3liberado) {
                upgrade3();
                upg3liberado = true;
            }
            if (numero >= 1500 && !upg4liberado) {
                upgrade4();
                upg4liberado = true;
            }
            renderJoia();
        }
        
        //RENDER
        function renderJoia() {
            const p = document.querySelector(".main")
            p.innerText = numero.toFixed(1) + "🪙"
        }
        renderJoia()
        function goldPorSeg() {
            const p = document.querySelector("#goldPerSec")
            p.innerText = (pontosPorSegundo * multiPontos).toFixed(1) + "g/s"
        }
        renderJoia();
        goldPorSeg();

        //UPGRADES
        function upgrade1() {
            const div = document.querySelector(".upgrade")

            const pipa = document.createElement("button")
            pipa.innerText = "🪁"
            pipa.classList.add("pipa")

            pipa.onclick = () => upgrade1buy(pipa)

            div.appendChild(pipa)
        }

        function upgrade1buy(pipa) {
            if (numero >= 100 && !upg1comprado) {

                numero -= 100;
                upg1comprado = true;
                renderJoia()
                pontosPorClick += 1;

                pipa.innerText = "comprado";
                pipa.classList.add("comprado")
            
               
                renderJoia();
                goldPorSeg();
            }
        }
        function upgrade2() {
            const div = document.querySelector(".upgrade")

            const presente = document.createElement("button")
            presente.innerText = "🎁"
            presente.classList.add("presente")

            presente.onclick = () => upgrade2buy(presente)

            div.appendChild(presente)
        }

        function upgrade2buy(presente) {
            if (numero >= 600 && !upg2comprado) {

                numero -= 600;
                upg2comprado = true;
                renderJoia()

                pontosPorClick += 3;

                presente.innerText = "comprado";
                presente.classList.add("comprado")
            
               
                renderJoia();
                goldPorSeg();
            }
        }
        function upgrade3() {
            const div = document.querySelector(".upgrade")

            const coração = document.createElement("button")
            coração.innerText = "❤️"
            coração.classList.add("coração")

            coração.onclick = () => upgrade3buy(coração)

            div.appendChild(coração)
        }

        function upgrade3buy(coração) {
            if (numero >= 1400 && !upg3comprado) {

                numero -= 1400;
                upg3comprado = true;
                renderJoia()

                pontosPorClick *= 1.1;

                coração.innerText = "comprado";
                coração.classList.add("comprado")
            
               
                renderJoia();
                goldPorSeg();
            }
        }function upgrade4() {
            const div = document.querySelector(".upgrade")

            const áries = document.createElement("button")
            áries.innerText = "♈️"
            áries.classList.add("áries")

            áries.onclick = () => upgrade4buy(áries)

            div.appendChild(áries)
        }

        function upgrade4buy(áries) {
            if (numero >= 1500 && !upg4comprado) {

                numero -= 1500;
                upg4comprado = true;
                renderJoia()

                multiPontos += 0.5;

                áries.innerText = "comprado";
                áries.classList.add("comprado")
            
               
                renderJoia();
                goldPorSeg();
            }
        }
        

        renderJoia();

    </script>
</body>
</html>
