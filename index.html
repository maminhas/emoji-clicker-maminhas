<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emoji clicker</title>
    <style>

        * {
            margin: 0;
            box-sizing: border-box;
            
        }
        body {
            min-height: 100vh;
            border: 25px solid black;
            font-family: "Comic Sans MS", cursive;

            display: grid;
            grid-template-rows: auto 1fr;
        }
        header {
            text-align: center;
            border: 3px solid black;
        }
        a {
            padding-left: 800px;
            font-size: 20px;
        }
        main {
            display: grid;
           place-items: center;
           border: 3px solid black;
        }
        .main {
           font-size: 40px;
        }
        footer {

        }
        section {
            display: grid;
            grid-template-columns: 180px 1fr;
            min-height: calc(100vh - 100px);
        }
        .upgrade h3 {
            font-size: 25px;
        }
        
        .upgrades {
            border: 3px solid black;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;

        }
        .upgrade {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .farm {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;

        }
        .farm-area {
            border: 3px solid black;
            padding: 10px;
        }
        .farm-area h3 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }
        .farm button {
            font-family: inherit;
            font-size: 18px;
            padding: 8px;
        }
        .game {
            display: grid;
             grid-template-rows: 1fr auto;
        }

    </style>
</head>
<body>
    <header>
        <h1>emoji clicker <sup><a href="index.html">emojis que usei</a></sup>
                          <sup><a href="emojis.html">emojis que usei</a></sup></h1>
    </header>
    <section> 
         <div class="upgrades">
        <h3>upgrades</h3>
            <div class="upgrade">
            </div>
        </div>   

    <div class="game">
    <main>
        <button class="main" onclick="joia()">0</button>
    </main>
    
        <div class="farm-area">
        <h3>fazenda</h3>
            <div class="farm">
                <button onclick="felizComprado()">🙂 <br>
                custa 100</button>
                <button onclick="sorrisoComprado()">😁 <br>
                custa 500</button>
                <button onclick="rindoComprado()">😂 <br>
                custa 1500</button>
                <button onclick="derretidoComprado()">🥴 <br>
                custa 4000</button>
                <button onclick="doidoComprado()">🤪 <br>
                custa 15000</button>
                <button onclick="iradoComprado()">😎 <br>
                custa 40000</button>
            </div>
        </div>
    </div>  
    </section>
    <footer>
    </footer>
    <script>
        let numero = 0;
        let pontosPorSegundo = 0;
        let pontosPorClick = 1;
        let upg1liberado = false;
        let upg1comprado = false;
        let upg2liberado = false;
        let upg2comprado = false;
        let upg3liberado = false;
        let upg3comprado = false;
        let upg4liberado = false;
        let upg4comprado = false;


        setInterval(() => {
            numero += pontosPorSegundo;
            renderJoia();
        }, 1000)

        function felizComprado() {
            if (numero >= 100) {
                pontosPorSegundo += 1;
                numero -=100;
            }
            
        }
        function sorrisoComprado() {
            if (numero >= 500) {
                pontosPorSegundo += 15;
                numero -=500;
            }
            
        }
        function rindoComprado() {
            if (numero >= 1500) {
                pontosPorSegundo += 100;
                numero -=1500;
            }
            
        }
        function derretidoComprado() {
            if (numero >= 4000) {
                pontosPorSegundo += 380;
                numero -=4000;
            }
            
        }
        function doidoComprado() {
            if (numero >= 15000) {
                pontosPorSegundo += 1300;
                numero -=15000;
            }
            
        }
        function iradoComprado() {
            if (numero >= 40000) {
                pontosPorSegundo += 10500;
                numero -=40000;
            }
            
        }

        function pontos() {
            numero += pontosPorClick;
        }

        function joia() {
            pontos()
            renderJoia()

            if (numero >= 100 && !upg1liberado) {
                upgrade1();
                upg1liberado = true;
            }
            if (numero >= 600 && !upg2liberado) {
                upgrade2();
                upg2liberado = true;
            }
            if (numero >= 1400 && !upg3liberado) {
                upgrade3();
                upg3liberado = true;
            }
            if (numero >= 1500 && !upg4liberado) {
                upgrade4();
                upg4liberado = true;
            }
            
        }
        

        function renderJoia() {
            const button = document.querySelector("main button")
            button.innerText = numero.toFixed(2)
        }
        renderJoia()

        function upgrade1() {
            const div = document.querySelector(".upgrade")

            const pipa = document.createElement("button")
            pipa.innerText = "🪁"
            pipa.classList.add("pipa")

            pipa.onclick = () => upgrade1buy(pipa)

            div.appendChild(pipa)
        }

        function upgrade1buy(pipa) {
            if (numero >= 100 && !upg1comprado) {

                numero -= 100;
                upg1comprado = true;

                pontosPorClick += 1;

                pipa.innerText = "comprado";
            
               
                renderJoia();
            }
        }
        function upgrade2() {
            const div = document.querySelector(".upgrade")

            const presente = document.createElement("button")
            presente.innerText = "🎁"
            presente.classList.add("presente")

            presente.onclick = () => upgrade2buy(presente)

            div.appendChild(presente)
        }

        function upgrade2buy(presente) {
            if (numero >= 600 && !upg2comprado) {

                numero -= 600;
                upg2comprado = true;

                pontosPorClick += 3;

                presente.innerText = "comprado";
            
               
                renderJoia();
            }
        }
        function upgrade3() {
            const div = document.querySelector(".upgrade")

            const coração = document.createElement("button")
            coração.innerText = "❤️"
            coração.classList.add("coração")

            coração.onclick = () => upgrade3buy(coração)

            div.appendChild(coração)
        }

        function upgrade3buy(coração) {
            if (numero >= 1400 && !upg3comprado) {

                numero -= 1400;
                upg3comprado = true;

                pontosPorClick *= 1.1;

                coração.innerText = "comprado";
            
               
                renderJoia();
            }
        }function upgrade4() {
            const div = document.querySelector(".upgrade")

            const áries = document.createElement("button")
            áries.innerText = "♈️"
            áries.classList.add("áries")

            áries.onclick = () => upgrade4buy(áries)

            div.appendChild(áries)
        }

        function upgrade4buy(áries) {
            if (numero >= 1500 && !upg4comprado) {

                numero -= 1500;
                upg4comprado = true;

                pontosPorSegundo *= 1.5;

                áries.innerText = "comprado";
            
               
                renderJoia();
            }
        }
        

        renderJoia();

    </script>
</body>
</html>
