<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emoji clicker</title>
</head>
<body>
    <header>
        <h1>emoji clicker</h1>
    </header>
    <main>
        <button class="main" onclick="joia()">0</button>
    </main>
    <footer>
        <h3>upgrades</h3>
        <section>
            <div class="upgrade">

            </div>
            <h3>fazenda</h3>
            <div class="farm">
                <button onclick="felizComprado()">🙂 <br>
                custa 100</button>
                <button onclick="sorrisoComprado()">😁 <br>
                custa 400</button>
            </div>
        </section>
    </footer>
    <script>
        let numero = 0;
        let pontosPorSegundo = 0;
        let pontosPorClick = 1;
        let upg1liberado = false;
        let upg1comprado = false;
        let upg2liberado = false;
        let upg2comprado = false;


        setInterval(() => {
            numero += pontosPorSegundo;
            renderJoia();
        }, 1000)

        function felizComprado() {
            if (numero >= 100) {
                pontosPorSegundo += 1;
                numero -=100;
            }
            
        }
        function sorrisoComprado() {
            if (numero >= 400) {
                pontosPorSegundo += 25;
                numero -=400;
            }
            
        }

        function pontos() {
            numero += pontosPorClick;
        }

        function joia() {
            pontos()
            renderJoia()

            if (numero >= 20 && !upg1liberado) {
                upgrade1();
                upg1liberado = true;
            }
            if (numero >= 100 && !upg2liberado) {
                upgrade2();
                upg2liberado = true;
            }
            
        }
        

        function renderJoia() {
            const button = document.querySelector("main button")
            button.innerText = numero.toFixed(1)
        }
        renderJoia()

        function upgrade1() {
            const div = document.querySelector(".upgrade")

            const pipa = document.createElement("button")
            pipa.innerText = "🪁"
            pipa.classList.add("pipa")

            pipa.onclick = () => upgrade1buy(pipa)

            div.appendChild(pipa)
        }

        function upgrade1buy(pipa) {
            if (numero >= 20 && !upg1comprado) {

                numero -= 20;
                upg1comprado = true;

                pontosPorClick += 1;

                pipa.innerText = "comprado";
            
               
                renderJoia();
            }
        }
        function upgrade2() {
            const div = document.querySelector(".upgrade")

            const presente = document.createElement("button")
            presente.innerText = "🎁"
            presente.classList.add("presente")

            presente.onclick = () => upgrade2buy(presente)

            div.appendChild(presente)
        }

        function upgrade2buy(presente) {
            if (numero >= 100 && !upg2comprado) {

                numero -= 100;
                upg2comprado = true;

                pontosPorClick += 3;

                presente.innerText = "comprado";
            
               
                renderJoia();
            }
        }

        renderJoia();

    </script>
</body>
</html>
